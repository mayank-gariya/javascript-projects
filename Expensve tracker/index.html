<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header>
            <h1><i class="fa-solid fa-wallet"></i> ExpenseTracker</h1>
            <p>Take control of your finances</p>
        </header>

        <!-- Balance Overview Cards -->
        <section class="balance-section">
            <div class="card total-balance">
                <h3>Total Balance</h3>
                <h1 id="balance">₹0.00</h1>
            </div>
            <div class="income-expense-container">
                <div class="card income-card">
                    <i class="fa-solid fa-arrow-trend-up"></i>
                    <div>
                        <h4>Income</h4>
                        <p id="total-income">₹0.00</p>
                    </div>
                </div>
                <div class="card expense-card">
                    <i class="fa-solid fa-arrow-trend-down"></i>
                    <div>
                        <h4>Expense</h4>
                        <p id="total-expense">₹0.00</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Main Content Grid -->
        <div class="main-grid">
            <!-- Add Transaction Form -->
            <section class="form-section card">
                <h2>Add New Transaction</h2>
                <form id="transaction-form">
                    <div class="form-control">
                        <label for="text">Description</label>
                        <input type="text" id="text" placeholder="e.g., Salary, Groceries..." required>
                    </div>
                    <div class="form-control">
                        <label for="amount">Amount <span class="hint">(negative - expense, positive - income)</span></label>
                        <input type="number" id="amount" placeholder="e.g., 500 or -50" step="0.01" required>
                    </div>
                    <div class="form-control">
                        <label for="category">Category</label>
                        <select id="category">
                            <option value="General">General</option>
                            <option value="Food">Food & Drinks</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Bills">Bills & Utilities</option>
                            <option value="Income">Income</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-primary">Add Transaction</button>
                </form>
            </section>

            <!-- History Section -->
            <section class="history-section card">
                <h2>Transaction History</h2>
                <ul id="list" class="list">
                    <!-- Dynamic Transaction Items will go here -->
                    <!-- Example placeholder items styled below -->
                    <li class="minus">
                        <div class="item-info">
                            <span class="item-title">Grocery Store</span>
                            <span class="item-category">Food</span>
                        </div>
                        <div class="item-right">
                            <span class="item-amount">-₹450.00</span>
                            <button class="delete-btn"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </li>
                    <li class="plus">
                        <div class="item-info">
                            <span class="item-title">Freelance Work</span>
                            <span class="item-category">Income</span>
                        </div>
                        <div class="item-right">
                            <span class="item-amount">+₹5,000.00</span>
                            <button class="delete-btn"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </li>
                </ul>
            </section>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
